version: "2"

linters:
  # CHANGED: ignore irrelevant reports
  exclusions:
    rules:
      path: ^shamir/
      linters:
        - nonamedreturns
        - staticcheck

  default: none
  enable:
    # Enabled by default
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Additional checks
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - durationcheck
    - errname
    - exhaustive
    - exptostd
    - gocheckcompilerdirectives
    - gocritic
    - iface
    - importas
    - nilerr
    - nilnesserr
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - predeclared
    - reassign
    - recvcheck
    - rowserrcheck
    - thelper
    - tparallel
    - unconvert
    - usestdlibvars
    - usetesting
    - wastedassign

  settings:
    exhaustive:
      # "default" is good enough to be exhaustive
      default-signifies-exhaustive: true
    gocritic:
      disabled-checks:
        - exitAfterDefer
        - ifElseChain
        - singleCaseSwitch
    staticcheck:
      checks:
        # Defaults
        - "all"
        - "-ST1000"
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
        #
        - "-QF1001"
        - "-QF1003"
        - "-QF1003"
        - "-QF1007"
    usestdlibvars:
      http-method: false


run:
  timeout: 10m
